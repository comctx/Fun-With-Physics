<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rube Goldberg Creator</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#181d24;
  color:white;
  overflow:hidden;
}

#app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 14px;
  background:#242b35;
  border-bottom:1px solid #3a4350;
}

header h1{
  margin:0;
  font-size:22px;
}

#status{
  font-size:13px;
  color:#cbd6e3;
}

.topButtons{
  display:flex;
  gap:8px;
}

button{
  border:1px solid #4d5968;
  background:#303946;
  color:white;
  border-radius:10px;
  padding:10px 13px;
  font-weight:700;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.run{
  background:#168c4a;
}

.reset{
  background:#8a3940;
}

#workspace{
  flex:1;
  position:relative;
  overflow:hidden;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
  background:
    linear-gradient(#27303a 1px, transparent 1px),
    linear-gradient(90deg,#27303a 1px, transparent 1px),
    #1d232b;
  background-size:40px 40px;
}

#scoreBox{
  position:absolute;
  top:12px;
  left:12px;
  background:rgba(20,25,31,.86);
  border:1px solid #475361;
  border-radius:12px;
  padding:10px 12px;
  pointer-events:none;
}

#scoreBox strong{
  display:block;
  font-size:15px;
}

#scoreBox span{
  font-size:12px;
  color:#c8d1dd;
}

#selectionPanel{
  position:absolute;
  z-index:8;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  width:min(720px,calc(100% - 20px));
  display:none;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:7px;
  padding:9px;
  border:1px solid #526070;
  border-radius:14px;
  background:rgba(29,35,43,.96);
  box-shadow:0 12px 30px rgba(0,0,0,.28);
}
#selectionPanel.show{display:grid}
#selectionPanel button{padding:8px 6px;font-size:12px}
#selectionLabel{
  grid-column:1/-1;
  color:#dce5ef;
  font-size:12px;
  text-align:center;
}
.danger{background:#8a3940}

#tray{
  display:grid;
  grid-template-columns:repeat(9,minmax(74px,1fr));
  gap:7px;
  padding:8px;
  background:#242b35;
  border-top:1px solid #3a4350;
  overflow-x:auto;
}

.partButton{
  min-width:76px;
  min-height:58px;
  padding:7px 4px;
  font-size:12px;
  text-align:center;
  background:#303946;
}

.partButton .icon{
  display:block;
  font-size:23px;
  margin-bottom:3px;
}

@media(max-width:800px){
  header{
    flex-wrap:wrap;
  }

  header h1{
    font-size:18px;
  }

  #tray{
    grid-template-columns:repeat(9,86px);
  }
  #selectionPanel{
    grid-template-columns:repeat(4,1fr);
  }
  .topButtons{
    flex-wrap:wrap;
  }
}
</style>
</head>

<body>

<div id="app">

<header>
  <div>
    <h1>⚙️ Rube Goldberg Creator</h1>
    <div id="status">Build something ridiculous. Get the ball to ring the bell.</div>
  </div>

  <div class="topButtons">
    <button id="undoBtn">↶ Undo</button>
    <button id="saveBtn">💾 Save</button>
    <button id="loadBtn">📂 Load</button>
    <button id="clearBtn">Clear</button>
    <button id="runBtn" class="run">▶ RUN</button>
    <button id="resetBtn" class="reset">Reset</button>
  </div>
</header>

<div id="workspace">
  <canvas id="game"></canvas>

  <div id="scoreBox">
    <strong id="score">Absurdity Score: 0</strong>
    <span id="pieceCount">Pieces: 0</span>
  </div>

  <div id="selectionPanel">
    <div id="selectionLabel">Selected</div>
    <button id="rotateLeftBtn">↺ Rotate</button>
    <button id="rotateRightBtn">↻ Rotate</button>
    <button id="smallerBtn">− Size</button>
    <button id="largerBtn">＋ Size</button>
    <button id="flipBtn">⇆ Flip</button>
    <button id="duplicateBtn">⧉ Copy</button>
    <button id="deleteBtn" class="danger">Delete</button>
  </div>
</div>

<div id="tray">

  <button class="partButton" data-part="ball">
    <span class="icon">🔴</span>
    Ball
  </button>

  <button class="partButton" data-part="ramp">
    <span class="icon">📐</span>
    Ramp
  </button>

  <button class="partButton" data-part="domino">
    <span class="icon">▮</span>
    Domino
  </button>

  <button class="partButton" data-part="spring">
    <span class="icon">🌀</span>
    Spring
  </button>

  <button class="partButton" data-part="fan">
    <span class="icon">🌀</span>
    Fan
  </button>

  <button class="partButton" data-part="magnet">
    <span class="icon">🧲</span>
    Magnet
  </button>

  <button class="partButton" data-part="pendulum">
    <span class="icon">🕰️</span>
    Pendulum
  </button>

  <button class="partButton" data-part="blast">
    <span class="icon">💥</span>
    Blast
  </button>

  <button class="partButton" data-part="bell">
    <span class="icon">🔔</span>
    Bell
  </button>

</div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;

let objects = [];
let history = [];

let running = false;
let won = false;

let selected = null;
let dragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;

let lastTime = performance.now();

const gravity = 760;
const SAVE_KEY = 'rube_goldberg_creator_machine_v2';

function pushHistory(){
  history.push(JSON.stringify(objects));
  if(history.length>60) history.shift();
}

function setSelected(o){
  selected=o||null;
  const panel=document.getElementById('selectionPanel');
  if(selected){
    panel.classList.add('show');
    document.getElementById('selectionLabel').textContent='Selected: '+selected.type.toUpperCase();
  }else{
    panel.classList.remove('show');
  }
}

function resize(){
  const rect = canvas.getBoundingClientRect();
  width = rect.width;
  height = rect.height;

  canvas.width = Math.floor(width * devicePixelRatio);
  canvas.height = Math.floor(height * devicePixelRatio);

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );
}

window.addEventListener("resize",resize);
resize();

function makeObject(type,x,y){

  const base = {
    id:Date.now()+Math.random(),
    type,
    x,
    y,
    angle:0,
    vx:0,
    vy:0,
    scale:1,
    active:true
  };

  if(type==="ball"){
    return {
      ...base,
      radius:16,
      movable:true
    };
  }

  if(type==="ramp"){
    return {
      ...base,
      width:120,
      height:14,
      angle:-0.25
    };
  }

  if(type==="domino"){
    return {
      ...base,
      width:16,
      height:58,
      falling:false,
      angularVelocity:0
    };
  }

  if(type==="spring"){
    return {
      ...base,
      width:55,
      height:20,
      compressed:false
    };
  }

  if(type==="fan"){
    return {
      ...base,
      radius:28,
      direction:1
    };
  }

  if(type==="magnet"){
    return {
      ...base,
      radius:28,
      strength:700
    };
  }

  if(type==="pendulum"){
    return {
      ...base,
      length:100,
      swing:0.65,
      velocity:0
    };
  }

  if(type==="blast"){
    return {
      ...base,
      radius:26,
      triggered:false
    };
  }

  if(type==="bell"){
    return {
      ...base,
      width:50,
      height:60,
      rung:false
    };
  }

  return base;
}

function defaultMachine(){

  objects = [];

  objects.push(
    makeObject("ball",80,100)
  );

  const ramp = makeObject(
    "ramp",
    170,
    180
  );

  ramp.angle = .22;
  objects.push(ramp);

  const bell = makeObject(
    "bell",
    width-90,
    height-100
  );

  objects.push(bell);

  updateScore();
}

defaultMachine();

function addPart(type){

  if(running) return;

  pushHistory();

  let x = width/2;
  let y = height/2;

  if(type==="ball"){
    const existing =
      objects.find(o=>o.type==="ball");

    if(existing){
      document.getElementById("status")
        .textContent =
        "Only one main ball is needed.";
      return;
    }
  }

  if(type==="bell"){
    const existing =
      objects.find(o=>o.type==="bell");

    if(existing){
      document.getElementById("status")
        .textContent =
        "You already have a bell.";
      return;
    }
  }

  const added=makeObject(type,x,y);
  objects.push(added);
  setSelected(added);

  updateScore();
}

document
.querySelectorAll(".partButton")
.forEach(button=>{

  button.addEventListener("click",()=>{
    addPart(button.dataset.part);
  });

});

function updateScore(){

  const count = objects.length;

  let absurdity = 0;

  objects.forEach(o=>{

    if(o.type==="domino") absurdity += 8;
    if(o.type==="spring") absurdity += 14;
    if(o.type==="fan") absurdity += 18;
    if(o.type==="magnet") absurdity += 22;
    if(o.type==="pendulum") absurdity += 25;
    if(o.type==="blast") absurdity += 30;
    if(o.type==="ramp") absurdity += 5;

  });

  if(count>10){
    absurdity +=
      (count-10)*5;
  }

  document.getElementById("score")
    .textContent =
    "Absurdity Score: "+absurdity;

  document.getElementById("pieceCount")
    .textContent =
    "Pieces: "+count;
}

function pointerPosition(e){

  const rect =
    canvas.getBoundingClientRect();

  const p =
    e.touches
    ? e.touches[0]
    : e;

  return {
    x:p.clientX-rect.left,
    y:p.clientY-rect.top
  };
}

function hitTest(o,x,y){

  if(o.type==="ball"){
    return (
      Math.hypot(
        x-o.x,
        y-o.y
      ) < 26
    );
  }

  if(
    o.type==="fan" ||
    o.type==="magnet" ||
    o.type==="blast"
  ){
    return (
      Math.hypot(
        x-o.x,
        y-o.y
      ) < 38
    );
  }

  if(o.type==="pendulum"){
    return (
      Math.hypot(
        x-o.x,
        y-o.y
      ) < 40
    );
  }

  return (
    x>o.x-60 &&
    x<o.x+60 &&
    y>o.y-60 &&
    y<o.y+60
  );
}

function pointerDown(e){

  if(running) return;

  const p =
    pointerPosition(e);

  setSelected(null);

  for(
    let i=objects.length-1;
    i>=0;
    i--
  ){

    if(hitTest(
      objects[i],
      p.x,
      p.y
    )){
      setSelected(objects[i]);

      dragging = true;

      dragOffsetX =
        p.x-selected.x;

      dragOffsetY =
        p.y-selected.y;

      pushHistory();

      break;
    }
  }
}

function pointerMove(e){

  if(
    !dragging ||
    !selected ||
    running
  ) return;

  const p =
    pointerPosition(e);

  selected.x=Math.max(15,Math.min(width-15,p.x-dragOffsetX));
  selected.y=Math.max(15,Math.min(height-15,p.y-dragOffsetY));
}

function pointerUp(){
  dragging=false;
}

canvas.addEventListener(
  "mousedown",
  pointerDown
);

canvas.addEventListener(
  "mousemove",
  pointerMove
);

window.addEventListener(
  "mouseup",
  pointerUp
);

canvas.addEventListener(
  "touchstart",
  e=>{
    e.preventDefault();
    pointerDown(e);
  },
  {passive:false}
);

canvas.addEventListener(
  "touchmove",
  e=>{
    e.preventDefault();
    pointerMove(e);
  },
  {passive:false}
);

canvas.addEventListener(
  "touchend",
  pointerUp
);

canvas.addEventListener(
  "dblclick",
  e=>{

    if(running) return;

    const p =
      pointerPosition(e);

    for(
      let i=objects.length-1;
      i>=0;
      i--
    ){

      const o =
        objects[i];

      if(hitTest(o,p.x,p.y)){

        if(o.type==="ramp"){
          o.angle += Math.PI/8;
        }

        if(o.type==="fan"){
          o.direction *= -1;
        }

        break;
      }
    }
  }
);

function startRun(){

  running=true;
  won=false;

  document.getElementById("status")
    .textContent =
    "Machine running...";

  objects.forEach(o=>{

    if(o.type==="ball"){
      o.vx=0;
      o.vy=0;
    }

    if(o.type==="domino"){
      o.falling=false;
      o.angle=0;
      o.angularVelocity=0;
    }

    if(o.type==="blast"){
      o.triggered=false;
    }

    if(o.type==="bell"){
      o.rung=false;
    }
  });
}

function resetSimulation(){

  running=false;
  won=false;

  if(history.length){
    objects =
      JSON.parse(
        history[history.length-1]
      );
  }

  document.getElementById("status")
    .textContent =
    "Build something ridiculous.";

  updateScore();
}

function groundCollision(ball){

  if(
    ball.y+ball.radius >
    height-5
  ){
    ball.y =
      height-5-ball.radius;

    ball.vy *= -.52;

    ball.vx *= .97;
  }

  if(
    ball.x-ball.radius<0
  ){
    ball.x=ball.radius;
    ball.vx*=-.6;
  }

  if(
    ball.x+ball.radius>width
  ){
    ball.x=
      width-ball.radius;

    ball.vx*=-.6;
  }
}

function rampCollision(ball,ramp){
  const scale=ramp.scale||1;
  const half=(ramp.width*scale)/2;
  const thickness=Math.max(7,(ramp.height*scale)/2);
  const radius=ball.radius*(ball.scale||1);

  const cos=Math.cos(ramp.angle);
  const sin=Math.sin(ramp.angle);
  const dx=ball.x-ramp.x;
  const dy=ball.y-ramp.y;
  const localX=dx*cos+dy*sin;
  const localY=-dx*sin+dy*cos;

  if(Math.abs(localX)>half+radius) return;
  if(localY<-radius-thickness || localY>radius+thickness) return;

  const target=-radius-thickness;
  if(localY>target && ball.vy>=-180){
    const correction=localY-target;
    const nx=-sin;
    const ny=cos;

    ball.x-=nx*correction;
    ball.y-=ny*correction;

    const tangent=ball.vx*cos+ball.vy*sin;
    ball.vx=tangent*cos;
    ball.vy=tangent*sin;
  }
}

function updateBall(ball,dt){

  ball.vy +=
    gravity*dt;

  objects.forEach(o=>{

    if(o===ball) return;

    if(o.type==="ramp"){
      rampCollision(ball,o);
    }

    if(o.type==="fan"){
      const s=o.scale||1;
      const dx=ball.x-o.x;
      const dy=ball.y-o.y;
      const cos=Math.cos(o.angle||0);
      const sin=Math.sin(o.angle||0);
      const forward=dx*cos+dy*sin;
      const side=-dx*sin+dy*cos;
      const range=220*s;
      const dir=o.direction||1;
      const projected=forward*dir;

      if(projected>0 && projected<range && Math.abs(side)<65*s){
        const force=(1-projected/range)*620;
        ball.vx+=cos*dir*force*dt;
        ball.vy+=sin*dir*force*dt;
      }
    }

    if(o.type==="magnet"){

      const dx =
        o.x-ball.x;

      const dy =
        o.y-ball.y;

      const distance =
        Math.max(
          35,
          Math.hypot(dx,dy)
        );

      if(distance<230){

        const force =
          o.strength /
          distance;

        ball.vx +=
          dx/distance*
          force*
          30*
          dt;

        ball.vy +=
          dy/distance*
          force*
          30*
          dt;
      }
    }

    if(o.type==="spring"){
      if(!o.cooldown) o.cooldown=0;
      if(o.cooldown>0) o.cooldown-=dt;

      const s=o.scale||1;
      const dx=ball.x-o.x;
      const dy=ball.y-o.y;
      const cos=Math.cos(o.angle||0);
      const sin=Math.sin(o.angle||0);
      const lx=dx*cos+dy*sin;
      const ly=-dx*sin+dy*cos;

      if(o.cooldown<=0 && Math.abs(lx)<34*s && Math.abs(ly)<35*s){
        const launch=680*s;
        ball.vx+=-sin*launch;
        ball.vy+=-cos*launch;
        o.compressed=true;
        o.cooldown=.35;
        setTimeout(()=>{o.compressed=false},120);
      }
    }

    if(o.type==="blast"){

      const distance =
        Math.hypot(
          ball.x-o.x,
          ball.y-o.y
        );

      if(
        distance<45 &&
        !o.triggered
      ){

        o.triggered=true;

        const dx =
          ball.x-o.x;

        const dy =
          ball.y-o.y;

        const len =
          Math.max(
            1,
            Math.hypot(dx,dy)
          );

        ball.vx +=
          dx/len*600;

        ball.vy +=
          dy/len*600-300;
      }
    }

    if(o.type==="bell"){

      const distance =
        Math.hypot(
          ball.x-o.x,
          ball.y-o.y
        );

      if(
        distance<45 &&
        !o.rung
      ){

        o.rung=true;
        winGame();
      }
    }

    if(o.type==="domino"){

      if(
        Math.abs(ball.x-o.x)<28 &&
        Math.abs(ball.y-o.y)<55
      ){

        o.falling=true;

        if(
          ball.x<o.x
        ){
          o.angularVelocity=
            .9;
        }else{
          o.angularVelocity=
            -.9;
        }

        ball.vx +=
          o.angularVelocity*
          80;
      }
    }

  });

  ball.x +=
    ball.vx*dt;

  ball.y +=
    ball.vy*dt;

  groundCollision(ball);
}

function updateDominoes(dt){

  const dominoes =
    objects.filter(
      o=>o.type==="domino"
    );

  dominoes.forEach(d=>{

    if(d.falling){

      d.angularVelocity +=
        Math.sign(
          d.angularVelocity
        )*
        2.2*
        dt;

      d.angle +=
        d.angularVelocity*
        dt;

      if(
        Math.abs(d.angle)>
        Math.PI/2
      ){
        d.angle =
          Math.sign(d.angle)*
          Math.PI/2;
      }

      dominoes.forEach(other=>{

        if(other===d) return;

        if(
          Math.abs(
            other.x-d.x
          )<48 &&
          Math.abs(
            other.y-d.y
          )<40 &&
          Math.abs(d.angle)>.45
        ){

          other.falling=true;

          other.angularVelocity =
            Math.sign(
              d.angularVelocity
            )*.8;
        }

      });

    }

  });
}

function updatePendulums(dt){

  objects
  .filter(
    o=>o.type==="pendulum"
  )
  .forEach(p=>{

    if(!running) return;

    p.velocity +=
      (-gravity /
      p.length *
      Math.sin(p.swing))*
      dt;

    p.velocity *= .999;

    p.swing +=
      p.velocity*dt;

    const bx =
      p.x+
      Math.sin(p.swing)*
      p.length;

    const by =
      p.y+
      Math.cos(p.swing)*
      p.length;

    const ball =
      objects.find(
        o=>o.type==="ball"
      );

    if(ball){

      const distance =
        Math.hypot(
          ball.x-bx,
          ball.y-by
        );

      if(distance<34){

        ball.vx +=
          Math.cos(
            p.swing
          )*
          p.velocity*
          250;

        ball.vy +=
          Math.sin(
            p.swing
          )*
          p.velocity*
          250;
      }
    }
  });
}

function winGame(){

  if(won) return;

  won=true;
  running=false;

  const scoreText =
    document
    .getElementById("score")
    .textContent;

  document
  .getElementById("status")
  .textContent =
  "🔔 DING! Success! "+scoreText;

  flash=1;
}

let flash=0;

function drawBall(o){

  ctx.beginPath();

  ctx.arc(
    o.x,
    o.y,
    o.radius,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#ff4d4d";
  ctx.fill();

  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;
  ctx.stroke();
}

function drawRamp(o){

  ctx.save();

  ctx.translate(o.x,o.y);
  ctx.rotate(o.angle);
  ctx.scale(o.scale||1,o.scale||1);

  ctx.fillStyle="#c9954d";

  ctx.fillRect(
    -o.width/2,
    -o.height/2,
    o.width,
    o.height
  );

  ctx.restore();
}

function drawDomino(o){

  ctx.save();

  ctx.translate(
    o.x,
    o.y
  );

  ctx.rotate(
    o.angle
  );
  ctx.scale(o.scale||1,o.scale||1);

  ctx.fillStyle="#f2f2f2";

  ctx.fillRect(
    -o.width/2,
    -o.height/2,
    o.width,
    o.height
  );

  ctx.fillStyle="#222";

  ctx.beginPath();
  ctx.arc(0,-13,2.5,0,Math.PI*2);
  ctx.arc(0,13,2.5,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawSpring(o){
  ctx.save();
  ctx.translate(o.x,o.y);
  ctx.rotate(o.angle||0);
  ctx.scale(o.scale||1,o.scale||1);

  ctx.strokeStyle="#efc84a";
  ctx.lineWidth=4;
  ctx.beginPath();

  const h=o.compressed?10:25;

  for(let i=0;i<=8;i++){
    const x=-25+i*(50/8);
    const y=Math.sin(i*Math.PI)*h/2;
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }

  ctx.stroke();
  ctx.restore();
}

function drawFan(o){

  ctx.save();

  ctx.translate(o.x,o.y);
  ctx.rotate(o.angle||0);
  ctx.scale(o.scale||1,o.scale||1);

  ctx.fillStyle="#7ac8ff";

  ctx.beginPath();
  ctx.arc(0,0,24,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#fff";
  ctx.lineWidth=4;

  for(let i=0;i<4;i++){

    ctx.rotate(
      Math.PI/2
    );

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(17,0);
    ctx.stroke();
  }

  ctx.restore();

  ctx.strokeStyle =
    "rgba(122,200,255,.22)";

  for(let i=0;i<3;i++){

    ctx.beginPath();

    ctx.moveTo(
      o.x+
      o.direction*30,
      o.y-14+i*14
    );

    ctx.lineTo(
      o.x+
      o.direction*150,
      o.y-14+i*14
    );

    ctx.stroke();
  }
}

function drawMagnet(o){

  ctx.font="42px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    "🧲",
    o.x,
    o.y
  );
}

function drawPendulum(o){

  const bx =
    o.x+
    Math.sin(o.swing)*
    o.length;

  const by =
    o.y+
    Math.cos(o.swing)*
    o.length;

  ctx.strokeStyle="#d0d8e0";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(o.x,o.y);
  ctx.lineTo(bx,by);
  ctx.stroke();

  ctx.fillStyle="#d1a34f";

  ctx.beginPath();
  ctx.arc(
    bx,
    by,
    18,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.fillStyle="#aaa";

  ctx.beginPath();
  ctx.arc(
    o.x,
    o.y,
    7,
    0,
    Math.PI*2
  );
  ctx.fill();
}

function drawBlast(o){

  ctx.font =
    o.triggered
    ? "56px Arial"
    : "42px Arial";

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    o.triggered
      ? "💥"
      : "🧨",
    o.x,
    o.y
  );
}

function drawBell(o){

  ctx.save();

  ctx.translate(o.x,o.y);

  if(o.rung){
    ctx.rotate(
      Math.sin(
        performance.now()*.03
      )*.18
    );
  }

  ctx.font="52px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    "🔔",
    0,
    0
  );

  ctx.restore();
}

function drawSelection(){

  if(
    !selected ||
    running
  ) return;

  ctx.strokeStyle="#55d9ff";
  ctx.lineWidth=2;

  ctx.setLineDash(
    [6,5]
  );

  ctx.beginPath();

  ctx.arc(
    selected.x,
    selected.y,
    38,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.setLineDash([]);
}

function draw(){

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  ctx.fillStyle=
    "rgba(255,255,255,.08)";

  ctx.fillRect(
    0,
    height-5,
    width,
    5
  );

  objects.forEach(o=>{

    if(o.type==="ball")
      drawBall(o);

    if(o.type==="ramp")
      drawRamp(o);

    if(o.type==="domino")
      drawDomino(o);

    if(o.type==="spring")
      drawSpring(o);

    if(o.type==="fan")
      drawFan(o);

    if(o.type==="magnet")
      drawMagnet(o);

    if(o.type==="pendulum")
      drawPendulum(o);

    if(o.type==="blast")
      drawBlast(o);

    if(o.type==="bell")
      drawBell(o);
  });

  drawSelection();

  if(flash>0){

    ctx.fillStyle=
      `rgba(255,220,70,${flash*.35})`;

    ctx.fillRect(
      0,
      0,
      width,
      height
    );

    flash-=.03;
  }
}

function update(dt){

  if(!running) return;

  const ball =
    objects.find(
      o=>o.type==="ball"
    );

  if(ball){
    updateBall(
      ball,
      dt
    );
  }

  updateDominoes(dt);
  updatePendulums(dt);
}

function loop(time){

  let dt =
    (time-lastTime)/1000;

  lastTime=time;

  dt=Math.min(
    dt,
    .03
  );

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

document
.getElementById("runBtn")
.addEventListener(
  "click",
  startRun
);

document
.getElementById("resetBtn")
.addEventListener(
  "click",
  ()=>{
    location.reload();
  }
);

document
.getElementById("clearBtn")
.addEventListener(
  "click",
  ()=>{

    if(running) return;

    if(!confirm(
      "Clear the entire machine?"
    )) return;

    history.push(
      JSON.stringify(objects)
    );

    objects=[];

    updateScore();
  }
);

document
.getElementById("undoBtn")
.addEventListener(
  "click",
  ()=>{
    if(running || !history.length) return;
    objects=JSON.parse(history.pop());
    setSelected(null);
    updateScore();
  }
);

function modifySelected(fn){
  if(running || !selected) return;
  pushHistory();
  fn(selected);
  updateScore();
}

document.getElementById('rotateLeftBtn').addEventListener('click',()=>modifySelected(o=>o.angle-=Math.PI/12));
document.getElementById('rotateRightBtn').addEventListener('click',()=>modifySelected(o=>o.angle+=Math.PI/12));
document.getElementById('smallerBtn').addEventListener('click',()=>modifySelected(o=>o.scale=Math.max(.55,(o.scale||1)-.15)));
document.getElementById('largerBtn').addEventListener('click',()=>modifySelected(o=>o.scale=Math.min(2.2,(o.scale||1)+.15)));
document.getElementById('flipBtn').addEventListener('click',()=>modifySelected(o=>{
  if(o.type==='fan') o.direction=(o.direction||1)*-1;
  else if(o.type==='pendulum') o.swing*=-1;
  else o.angle+=Math.PI;
}));

document.getElementById('duplicateBtn').addEventListener('click',()=>{
  if(running || !selected || selected.type==='ball' || selected.type==='bell') return;
  pushHistory();
  const copy=JSON.parse(JSON.stringify(selected));
  copy.id=Date.now()+Math.random();
  copy.x=Math.min(width-20,copy.x+28);
  copy.y=Math.min(height-20,copy.y+28);
  copy.vx=0;
  copy.vy=0;
  if(copy.type==='domino'){copy.falling=false;copy.angularVelocity=0}
  if(copy.type==='blast') copy.triggered=false;
  objects.push(copy);
  setSelected(copy);
  updateScore();
});

document.getElementById('deleteBtn').addEventListener('click',()=>{
  if(running || !selected) return;
  pushHistory();
  objects=objects.filter(o=>o.id!==selected.id);
  setSelected(null);
  updateScore();
});

document.getElementById('saveBtn').addEventListener('click',()=>{
  if(running) return;
  localStorage.setItem(SAVE_KEY,JSON.stringify(objects));
  document.getElementById('status').textContent='Machine saved on this device.';
});

document.getElementById('loadBtn').addEventListener('click',()=>{
  if(running) return;
  const raw=localStorage.getItem(SAVE_KEY);
  if(!raw){
    document.getElementById('status').textContent='No saved machine yet.';
    return;
  }
  try{
    pushHistory();
    objects=JSON.parse(raw);
    setSelected(null);
    updateScore();
    document.getElementById('status').textContent='Saved machine loaded.';
  }catch(err){
    document.getElementById('status').textContent='Saved machine could not be loaded.';
  }
});

</script>

</body>
</html>
